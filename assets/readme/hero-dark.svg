<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="HyperLevel – the free, open-source growth OS for agentic solopreneurs, agencies, small businesses and startups">
  <title>HyperLevel – the free, open-source growth OS for agentic solopreneurs, agencies, small businesses and startups</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset=".55" stop-color="#0a1433"/>
      <stop offset="1" stop-color="#140b33"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset=".45" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#93c5fd" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e293b" stop-opacity=".88"/><stop offset="1" stop-color="#0b1022" stop-opacity=".88"/></linearGradient>
    <filter id="soft" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="card"><rect width="1280" height="520" rx="28"/></clipPath>
    <style>
      .t { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .pulseA { animation: pulse 7s ease-in-out infinite; transform-origin: 300px 160px; }
      .pulseB { animation: pulse 9s ease-in-out infinite reverse; transform-origin: 1000px 380px; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .85 } 50% { transform: scale(1.18); opacity: 1 } }
      .float { animation: float 6s ease-in-out infinite; }
      .d1 { animation-delay: -1s } .d2 { animation-delay: -2s } .d3 { animation-delay: -3s } .d4 { animation-delay: -4s } .d5 { animation-delay: -5s }
      .halo { animation: halo 4s ease-in-out infinite; }
      @keyframes halo { 0%,100% { opacity: .6 } 50% { opacity: 1 } }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
      .sweep { animation: sweep 5.5s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-420px) } 60%,100% { transform: translateX(1400px) } }
      .rise { animation: rise 1.2s cubic-bezier(.2,.8,.2,1) both; }
      .r2 { animation-delay: .25s } .r3 { animation-delay: .5s }
      @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .pulseA, .pulseB, .float, .sweep, .rise, .blink, .halo { animation: none } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="520" fill="url(#bg)"/>
    <rect width="1280" height="520" fill="url(#grid)"/>
    <circle class="pulseA" cx="300" cy="160" r="300" fill="url(#glowA)"/>
    <circle class="pulseB" cx="1000" cy="380" r="320" fill="url(#glowB)"/>
    <g transform="skewX(-18)"><rect class="sweep" x="0" y="0" width="380" height="520" fill="url(#shine)"/></g>

    <!-- floating feature chips -->
    <g class="t">
      <g class="float">
        <rect class="halo" x="58" y="68" width="184" height="46" rx="23" fill="#3b82f6" opacity=".35" filter="url(#soft)"/>
        <rect x="62" y="64" width="176" height="46" rx="23" fill="url(#glass)" stroke="url(#brand)" stroke-opacity=".75" stroke-width="1.4"/>
        <rect x="64" y="66" width="172" height="21" rx="21" fill="#fff" opacity=".06"/>
        <circle cx="85" cy="87" r="15" fill="url(#brand)" opacity=".22"/>
        <circle cx="85" cy="87" r="15" fill="none" stroke="url(#brand)" stroke-opacity=".6"/>
        <svg x="76" y="78" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>
        <text x="112" y="93" font-size="16" font-weight="650" fill="#f1f5f9" letter-spacing=".2">Automations</text>
      </g>
      <g class="float d4">
        <rect class="halo" x="30" y="234" width="140" height="46" rx="23" fill="#3b82f6" opacity=".35" filter="url(#soft)"/>
        <rect x="34" y="230" width="132" height="46" rx="23" fill="url(#glass)" stroke="url(#brand)" stroke-opacity=".75" stroke-width="1.4"/>
        <rect x="36" y="232" width="128" height="21" rx="21" fill="#fff" opacity=".06"/>
        <circle cx="57" cy="253" r="15" fill="url(#brand)" opacity=".22"/>
        <circle cx="57" cy="253" r="15" fill="none" stroke="url(#brand)" stroke-opacity=".6"/>
        <svg x="48" y="244" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        <text x="84" y="259" font-size="16" font-weight="650" fill="#f1f5f9" letter-spacing=".2">Inbox</text>
      </g>
      <g class="float d2">
        <rect class="halo" x="84" y="400" width="158" height="46" rx="23" fill="#3b82f6" opacity=".35" filter="url(#soft)"/>
        <rect x="88" y="396" width="150" height="46" rx="23" fill="url(#glass)" stroke="url(#brand)" stroke-opacity=".75" stroke-width="1.4"/>
        <rect x="90" y="398" width="146" height="21" rx="21" fill="#fff" opacity=".06"/>
        <circle cx="111" cy="419" r="15" fill="url(#brand)" opacity=".22"/>
        <circle cx="111" cy="419" r="15" fill="none" stroke="url(#brand)" stroke-opacity=".6"/>
        <svg x="102" y="410" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.42 10.92a1 1 0 0 0-.02-1.84L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.83l8.57 3.91a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>
        <text x="138" y="425" font-size="16" font-weight="650" fill="#f1f5f9" letter-spacing=".2">Courses</text>
      </g>
      <g class="float d1">
        <rect class="halo" x="1056" y="60" width="168" height="46" rx="23" fill="#3b82f6" opacity=".35" filter="url(#soft)"/>
        <rect x="1060" y="56" width="160" height="46" rx="23" fill="url(#glass)" stroke="url(#brand)" stroke-opacity=".75" stroke-width="1.4"/>
        <rect x="1062" y="58" width="156" height="21" rx="21" fill="#fff" opacity=".06"/>
        <circle cx="1083" cy="79" r="15" fill="url(#brand)" opacity=".22"/>
        <circle cx="1083" cy="79" r="15" fill="none" stroke="url(#brand)" stroke-opacity=".6"/>
        <svg x="1074" y="70" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
        <text x="1110" y="85" font-size="16" font-weight="650" fill="#f1f5f9" letter-spacing=".2">AI Agent</text>
      </g>
      <g class="float d3">
        <rect class="halo" x="1098" y="224" width="154" height="46" rx="23" fill="#3b82f6" opacity=".35" filter="url(#soft)"/>
        <rect x="1102" y="220" width="146" height="46" rx="23" fill="url(#glass)" stroke="url(#brand)" stroke-opacity=".75" stroke-width="1.4"/>
        <rect x="1104" y="222" width="142" height="21" rx="21" fill="#fff" opacity=".06"/>
        <circle cx="1125" cy="243" r="15" fill="url(#brand)" opacity=".22"/>
        <circle cx="1125" cy="243" r="15" fill="none" stroke="url(#brand)" stroke-opacity=".6"/>
        <svg x="1116" y="234" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 20a1 1 0 0 0 .55.89l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .52-1.34L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.74 1.67l7.22 7.99A2 2 0 0 1 10 14z"/></svg>
        <text x="1152" y="249" font-size="16" font-weight="650" fill="#f1f5f9" letter-spacing=".2">Funnels</text>
      </g>
      <g class="float d5">
        <rect class="halo" x="1036" y="412" width="166" height="46" rx="23" fill="#3b82f6" opacity=".35" filter="url(#soft)"/>
        <rect x="1040" y="408" width="158" height="46" rx="23" fill="url(#glass)" stroke="url(#brand)" stroke-opacity=".75" stroke-width="1.4"/>
        <rect x="1042" y="410" width="154" height="21" rx="21" fill="#fff" opacity=".06"/>
        <circle cx="1063" cy="431" r="15" fill="url(#brand)" opacity=".22"/>
        <circle cx="1063" cy="431" r="15" fill="none" stroke="url(#brand)" stroke-opacity=".6"/>
        <svg x="1054" y="422" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg>
        <text x="1090" y="437" font-size="16" font-weight="650" fill="#f1f5f9" letter-spacing=".2">Invoices</text>
      </g>
    </g>

    <!-- mark + wordmark -->
    <g transform="translate(590 70)"><g>
      <rect width="100" height="100" rx="23" fill="url(#mark)"/>
      <g fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M30 44 L50 24 L70 44"/>
        <path d="M30 62 L50 42 L70 62" stroke-opacity=".55"/>
      </g>
      <circle cx="50" cy="77" r="5" fill="#fff"/>
    </g></g>
    <text class="t" x="640" y="262" text-anchor="middle" font-size="92" font-weight="800" letter-spacing="-3" fill="url(#word)">HyperLevel</text>
    <text class="t" x="640" y="316" text-anchor="middle" font-size="23" font-weight="600" fill="#e2e8f0">The free, open-source growth OS for agentic solopreneurs, agencies, small businesses &amp; startups</text>
    <text class="t" x="640" y="356" text-anchor="middle" font-size="19" fill="#94a3b8">CRM · funnels · inbox · automations · AI agent · courses · invoices — one app, your server, 0 € per seat</text>

    <!-- terminal pill -->
    <g transform="translate(410 392)"><g class="t">
      <rect width="460" height="52" rx="14" fill="#020617" stroke="#1e293b"/>
      <circle cx="24" cy="26" r="5" fill="#ef4444"/><circle cx="42" cy="26" r="5" fill="#f59e0b"/><circle cx="60" cy="26" r="5" fill="#22c55e"/>
      <text x="84" y="33" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="17" fill="#7dd3fc">$ <tspan fill="#e2e8f0">docker compose up -d</tspan></text>
      <rect class="blink" x="316" y="16" width="10" height="20" fill="#7dd3fc"/>
    </g></g>
  </g>
  <rect x=".5" y=".5" width="1279" height="519" rx="28" fill="none" stroke="#334155" stroke-opacity=".6"/>
</svg>
