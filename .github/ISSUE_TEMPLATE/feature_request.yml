name: Feature request
description: Suggest an idea or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and who it helps (agency, client login, end customer …).
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How should it work?
      description: Your proposed solution. If GoHighLevel or HubSpot already has this, a short description of how they do it helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / workarounds
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this myself (see CONTRIBUTING.md – a feature is its own module)
