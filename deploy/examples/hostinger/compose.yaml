# HyperLevel behind Traefik – e.g. Hostinger's "Docker + Traefik" VPS template (Docker Manager → Compose →
# paste this file) or any host where Traefik already terminates HTTPS.
#
# Project environment (Docker Manager → Environment, or a .env next to this file):
#   PGHL_DOMAIN=crm.your-domain.com
#   PGHL_BASE_URL=https://crm.your-domain.com
#   PGHL_ADMIN_EMAIL=you@your-domain.com      (first start only – otherwise the setup page)
#   PGHL_ADMIN_PASSWORD=…                      (first start only, at least 8 characters)
#   GOHIGH_IMAGE=ghcr.io/baisesystems/hyperlevel:latest  (optional; pin a version like :0.0.18)
#
# Traefik names follow Hostinger's template (websecure, web, letsencrypt); others via TRAEFIK_ENTRYPOINT,
# TRAEFIK_HTTP_ENTRYPOINT, TRAEFIK_CERTRESOLVER. Update: pull the new image and recreate the container.
# No registry access? deploy/examples/hostinger/build-from-source.compose.yaml builds on the server.
services:
  gohigh:
    image: ${GOHIGH_IMAGE:-ghcr.io/baisesystems/hyperlevel:latest}
    restart: unless-stopped
    environment:
      - PGHL_DATA_DIR=/data
      - PGHL_BEHIND_PROXY=1
      - PGHL_BASE_URL
      - PGHL_ADMIN_EMAIL
      - PGHL_ADMIN_PASSWORD
      - PGHL_COMPANY_NAME
      - PGHL_TIMEZONE
    volumes:
      - gohigh-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.gohigh.rule=Host(`${PGHL_DOMAIN:?set PGHL_DOMAIN}`)
      - traefik.http.routers.gohigh.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.gohigh.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.gohigh.loadbalancer.server.port=4700
      - traefik.http.routers.gohigh-http.rule=Host(`${PGHL_DOMAIN}`)
      - traefik.http.routers.gohigh-http.entrypoints=${TRAEFIK_HTTP_ENTRYPOINT:-web}
      - traefik.http.routers.gohigh-http.middlewares=gohigh-https
      - traefik.http.middlewares.gohigh-https.redirectscheme.scheme=https
volumes:
  gohigh-data:
